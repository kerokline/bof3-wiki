"/game/architecture/disc-and-files.html" = "../../formats/disc.html"
"/guides/editing.html" = "index.html"
"/game/architecture/editor-guide.html" = "../../guides/index.html"
"/game/architecture/frame-loop.html" = "../../systems/frame-loop.html"
"/game/architecture/gaps.html" = "../../appendix/open-questions.html"
"/game/architecture/index.html" = "../../overview.html"
"/game/architecture/loading.html" = "../../systems/loading.html"
