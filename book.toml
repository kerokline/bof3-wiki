[book]
title = "Breath of Fire III: game specifications"
description = "Independent research on the file formats, memory layouts and runtime of Breath of Fire III (US, PlayStation)."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 20

[preprocessor.mermaid]
command = "mdbook-mermaid"
